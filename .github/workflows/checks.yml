name: Check Generated Files
on: [ push ]

jobs:
  test:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      - name: Enter direnv
        uses: ./.github/actions/enter-direnv
      - name: Cache Go Modules
        uses: actions/setup-go@v6

      - name: Check If Generated Files Need To Be Regenerated
        run: ./scripts/check_need_regenerate.sh
