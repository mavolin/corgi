name: Test
on: [push, pull_request]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.23.0'
      - name: Set GOROOT
        run: echo "GOROOT=$(go env GOROOT)" >> $GITHUB_ENV
      - name: Run Unit Tests
        run: go test -race -tags test_stubs ./...
      - name: Check for missing attributes
        working-directory: tools/misc/attrtypecheck
        run: go run github.com/mavolin/corgi/tools/misc/attrtypecheck ../../../escape/attrtype/html5.go
