version: "2"

linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - dupword
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocritic
    - godot
    - gosec
    - govet
    - importas
    - ineffassign
    - intrange
    - loggercheck
    - misspell
    - nakedret
    - nilerr
    - nolintlint
    - nosprintfhostport
    - prealloc
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - testifylint
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - github.com/mavolin/corgi/v2/file/walk.Walk
        - github.com/mavolin/corgi/v2/file/walk.WalkT
    gocritic:
      disabled-checks:
        - singleCaseSwitch
    godot:
      exclude:
        - ^\s*\p{Ll} # Exclude lowercase comments
        - ^\s*(?:=+|/+|-+|\++) # Exclude lines that are not identifiers
        - ^\s*\w+$ # Exclude single-word identifiers
        - '[\w\d]:\s+' # Exclude colons
    unparam:
      check-exported: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: '[^/]+_test.go$'
        linters:
          - errcheck
          - unparam
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
